name: Release Python package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag; must equal v + project version
        required: true
        type: string
      publish_pypi:
        description: Also publish this verified artifact to PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      publisher_sha: ${{ steps.publisher.outputs.sha }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - id: source
        name: Record immutable source commit
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          if [[ "${{ github.event_name }}" == "push" && "$SOURCE_SHA" != "$EVENT_SHA" ]]; then
            echo "checked out source does not match the event SHA" >&2
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements/release.txt
      - name: Require exact release tag commit on main
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
      - id: publisher
        name: Pin trusted publisher revision from main
        run: echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
      - name: Install hash-locked release toolchain
        run: python -m pip install --require-hashes -r .github/requirements/release.txt
      - name: Audit hash-locked release toolchain
        run: pip-audit --require-hashes --requirement .github/requirements/release.txt
      - name: Install the SDK without resolving unpinned dependencies
        run: python -m pip install --no-deps --no-build-isolation .
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: python scripts/check_release_tag.py "$RELEASE_TAG"
      - run: python scripts/check_contract.py
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=viapost --cov-report=term-missing
      - name: Audit runtime dependencies only
        run: pip-audit --requirement requirements/runtime.txt
      - run: python -m build --no-isolation
      - run: twine check dist/*
      - name: Create checksums
        run: |
          mkdir checksums
          cd dist
          sha256sum * > ../checksums/SHA256SUMS
      - name: Make built distributions read-only
        run: chmod -R a-w dist checksums
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-checksums
          path: checksums/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
      - name: Test wheel in an isolated consumer environment
        run: |
          mkdir -p /tmp/viapost-consumer/artifacts
          cp dist/*.whl /tmp/viapost-consumer/artifacts/
          python -m venv /tmp/viapost-consumer/venv
          /tmp/viapost-consumer/venv/bin/pip install --require-hashes -r .github/requirements/runtime.txt
          /tmp/viapost-consumer/venv/bin/pip install --no-deps /tmp/viapost-consumer/artifacts/*.whl
          /tmp/viapost-consumer/venv/bin/python -c 'from viapost import AsyncViaPost, ViaPost; assert ViaPost and AsyncViaPost'
          cd dist
          sha256sum -c ../checksums/SHA256SUMS

  attest-build-provenance:
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  publish-github-release:
    needs:
      - verify-and-build
      - attest-build-provenance
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Artifacts remain built and verified at source_sha. The release
          # publisher is pinned to the protected main revision observed while
          # that source was admitted, so an older tag cannot run stale tooling.
          ref: ${{ needs.verify-and-build.outputs.publisher_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution-checksums
          path: checksums
      - name: Recover or publish the verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          SOURCE_SHA: ${{ needs.verify-and-build.outputs.source_sha }}
        run: >-
          python scripts/publish_release.py --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA"
          dist/* checksums/SHA256SUMS

  publish-to-pypi:
    needs:
      - verify-and-build
      - attest-build-provenance
      - publish-github-release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi == true
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Require the GitHub release to be published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          attestations: true
