name: Release Python package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag; must equal v + project version
        required: true
        type: string
      publish_pypi:
        description: Also publish this verified artifact to PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements/release.txt
      - name: Require exact release tag commit on main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Install hash-locked release toolchain
        run: python -m pip install --require-hashes -r .github/requirements/release.txt
      - name: Audit hash-locked release toolchain
        run: pip-audit --require-hashes --requirement .github/requirements/release.txt
      - name: Install the SDK without resolving unpinned dependencies
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python scripts/check_release_tag.py "$RELEASE_TAG"
      - run: python scripts/check_contract.py
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=viapost --cov-report=term-missing
      - name: Audit runtime dependencies only
        run: pip-audit --requirement requirements/runtime.txt
      - run: python -m build --no-isolation
      - run: twine check dist/*
      - name: Create checksums
        run: |
          mkdir checksums
          cd dist
          sha256sum * > ../checksums/SHA256SUMS
      - name: Make built distributions read-only
        run: chmod -R a-w dist checksums
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distribution-checksums
          path: checksums/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
      - name: Test wheel in an isolated consumer environment
        run: |
          mkdir -p /tmp/viapost-consumer/artifacts
          cp dist/*.whl /tmp/viapost-consumer/artifacts/
          python -m venv /tmp/viapost-consumer/venv
          /tmp/viapost-consumer/venv/bin/pip install --require-hashes -r .github/requirements/runtime.txt
          /tmp/viapost-consumer/venv/bin/pip install --no-deps /tmp/viapost-consumer/artifacts/*.whl
          /tmp/viapost-consumer/venv/bin/python -c 'from viapost import AsyncViaPost, ViaPost; assert ViaPost and AsyncViaPost'
          cd dist
          sha256sum -c ../checksums/SHA256SUMS

  attach-to-github-release:
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: python-distributions
          path: dist
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: distribution-checksums
          path: checksums
      - name: Attach installable packages and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/* checksums/SHA256SUMS --clobber

  attest-build-provenance:
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: python-distributions
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  publish-to-pypi:
    needs:
      - verify-and-build
      - attach-to-github-release
      - attest-build-provenance
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi == true
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          attestations: true
